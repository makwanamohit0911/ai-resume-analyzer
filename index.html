<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121e">
  <meta name="description" content="A private, browser-only resume and job description comparison demo.">
  <title>AI Resume Analyzer — Career Studio</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f5f6fa;--fg:#20243a;--card:#fff;--card-border:#e3e5ed;--border:#e1e3ec;
      --muted:#eff0f5;--muted-fg:#777e94;--input:#e1e3ec;--primary:#7965e6;
      --primary-2:#9585f0;--primary-fg:#fff;--accent:#efedff;--accent-fg:#6551ca;
      --danger:#c65358;--sidebar:#191d32;--sidebar-fg:#d8dced;--sidebar-border:#2a2f47;
      --shadow:0 8px 26px rgba(24,33,74,.06);--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--serif:Manrope,Inter,ui-sans-serif,system-ui,sans-serif;
    }
    html.dark {
      color-scheme:dark;
      --bg:#10121e;--fg:#e6e8f1;--card:#171a27;--card-border:#2c3040;--border:#2c3040;
      --muted:#202332;--muted-fg:#9da4b8;--input:#303446;--primary:#9a88ff;
      --primary-2:#b0a3ff;--primary-fg:#141326;--accent:#292541;--accent-fg:#c4baff;
      --danger:#ed8589;--sidebar:#0d0f19;--sidebar-fg:#d8dced;--sidebar-border:#242738;
      --shadow:0 8px 26px rgba(0,0,0,.13);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .app-shell{min-height:100vh}
    .sidebar{width:250px;background:var(--sidebar);color:var(--sidebar-fg);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;padding:26px 15px 16px;border-right:1px solid var(--sidebar-border)}
    .brand{display:flex;align-items:center;gap:11px;padding:0 12px 30px;font-family:var(--serif);font-weight:800;letter-spacing:-.6px;font-size:15px}
    .brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#9c8bff,#6653d8);box-shadow:0 6px 18px #7762ef55;flex:none}
    .brand small{display:block;font:500 9px var(--mono);letter-spacing:1.3px;color:#9ba5c6;margin-top:2px}
    .nav-label{color:#737f9f;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:1.3px;padding:13px 12px 9px}
    .nav-link{display:flex;align-items:center;gap:12px;padding:11px 12px;color:#aeb8d2;font-size:13px;font-weight:600;border-radius:10px;margin:2px 0;transition:background .2s,color .2s,transform .2s}
    .nav-link:hover{color:#fff;background:#ffffff0b;transform:translateX(2px)}
    .nav-link.active{color:#fff;background:linear-gradient(100deg,#7966ec38,#7661de15);box-shadow:inset 2px 0 #9c8dff}
    .nav-link.active svg{color:#b3a8ff}
    .side-bottom{margin-top:auto}
    .prototype-note{padding:13px;background:#ffffff09;border:1px solid #ffffff14;border-radius:12px;font-size:11px;line-height:1.55;color:#a9b2ca;margin:12px 3px 16px}
    .prototype-note strong{color:#dbd7ff;display:block;font-size:11px;margin-bottom:4px}
    .side-user{border-top:1px solid #ffffff16;padding:15px 8px 1px;display:flex;align-items:center;gap:10px}
    .avatar{width:33px;height:33px;border-radius:50%;background:#3b376c;color:#d4cdff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
    .side-user-name{font-size:12px;font-weight:600;color:#e4e8f3}
    .side-user-email{font:10px var(--mono);color:#8590af;margin-top:3px;overflow:hidden;text-overflow:ellipsis;max-width:165px}
    .workspace{margin-left:250px;min-width:0;width:calc(100% - 250px)}
    .topbar{height:67px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,52px);border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 87%,transparent);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
    .crumb{font:11px var(--mono);color:var(--muted-fg);letter-spacing:.2px}
    .mobile-head{display:none}
    .top-actions{display:flex;align-items:center;gap:9px}
    .icon-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);border-radius:11px;display:grid;place-items:center;transition:all .2s}
    .icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px)}
    .main-content{max-width:1440px;margin:0 auto;padding:36px clamp(20px,4vw,52px) 70px}
    .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
    .eyebrow{color:var(--primary);font:500 10px var(--mono);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
    h1,h2,h3,p{margin-top:0}
    h1{font:700 clamp(27px,3vw,38px)/1.16 var(--serif);letter-spacing:-1.2px;margin-bottom:8px}
    h2{font:700 21px/1.3 var(--serif);letter-spacing:-.5px;margin-bottom:8px}
    h3{font:700 15px/1.4 var(--font);margin-bottom:7px;letter-spacing:-.2px}
    .subtitle{color:var(--muted-fg);font-size:13px;line-height:1.7;max-width:660px;margin:0}
    .card{border:1px solid var(--card-border);background:var(--card);border-radius:17px;padding:22px;box-shadow:var(--shadow);min-width:0}
    .glass{background:linear-gradient(145deg,color-mix(in srgb,var(--card) 88%,#ada0ff 12%),var(--card))}
    .grid{display:grid;gap:18px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:700;transition:transform .2s,background .2s,border-color .2s;white-space:nowrap}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(110deg,#7461df,#8c76ed);color:#fff;box-shadow:0 5px 14px #7461df35}
    .btn-primary:hover{background:linear-gradient(110deg,#6754d1,#806ae5)}
    .btn-secondary{color:var(--fg);background:var(--card);border-color:var(--border)}
    .btn-secondary:hover,.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
    .btn-ghost{background:transparent;color:var(--muted-fg);border-color:transparent}
    .btn-danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent);border-color:color-mix(in srgb,var(--danger) 20%,transparent)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .field{display:flex;flex-direction:column;gap:7px;min-width:0}
    .field label{font-size:12px;font-weight:700}
    .field-hint{color:var(--muted-fg);font-size:11px;line-height:1.5}
    .input,.textarea,.select{width:100%;border:1px solid var(--input);border-radius:10px;background:var(--bg);color:var(--fg);padding:11px 13px;font-size:12px;outline:none;transition:border-color .2s,box-shadow .2s}
    .input:focus,.textarea:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 13%,transparent)}
    .textarea{resize:vertical;min-height:145px;line-height:1.6}
    .input::placeholder,.textarea::placeholder{color:var(--muted-fg);opacity:.75}
    .badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:color-mix(in srgb,var(--muted) 70%,transparent);color:var(--muted-fg);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:600;white-space:nowrap}
    .badge.purple{color:#a99aff;border-color:#8b7bea42;background:#8b7bea12}
    html:not(.dark) .badge.purple{color:#6551ca}
    .badge.green{color:#54c3a5;border-color:#32a88e42;background:#32a88e12}
    html:not(.dark) .badge.green{color:#17846d}
    .badge.amber{color:#e2b562;border-color:#d99c3d45;background:#d99c3d14}
    html:not(.dark) .badge.amber{color:#a46b19}
    .badge.red{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 28%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
    .muted{color:var(--muted-fg)}
    .mono{font-family:var(--mono)}
    .stat-card{min-height:125px;position:relative;overflow:hidden}
    .stat-card:after{content:"";position:absolute;width:96px;height:96px;right:-25px;top:-33px;border-radius:50%;background:color-mix(in srgb,var(--primary) 8%,transparent)}
    .stat-label{color:var(--muted-fg);font-size:11px;font-weight:600}
    .stat-value{font:700 31px var(--serif);letter-spacing:-1px;margin:10px 0 4px}
    .stat-foot{color:var(--muted-fg);font-size:10px;display:flex;align-items:center;gap:5px}
    .hero{min-height:390px;border-radius:24px;padding:clamp(28px,5vw,57px);color:#f8f7ff;background:radial-gradient(ellipse at 79% 33%,#8069d733 0,transparent 35%),radial-gradient(ellipse at 66% 110%,#3857aa52 0,transparent 44%),linear-gradient(125deg,#171c3a,#222751 65%,#342d69);position:relative;overflow:hidden;display:flex;align-items:center;margin-bottom:24px}
    .hero:before{content:"";position:absolute;width:430px;height:430px;border:1px solid #ffffff10;border-radius:50%;right:7%;top:50%;transform:translateY(-50%);box-shadow:0 0 0 40px #ffffff04,0 0 0 80px #ffffff03}
    .hero-copy{max-width:560px;position:relative;z-index:1}
    .hero .eyebrow{color:#b8afff}
    .hero h1{font-size:clamp(34px,5vw,58px);line-height:1.07;letter-spacing:-2px;max-width:550px;margin-bottom:16px}
    .hero p{color:#bec5dc;font-size:14px;line-height:1.8;max-width:465px;margin-bottom:25px}
    .hero .btn-primary{color:#fff;background:linear-gradient(115deg,#8572ef,#a08df7)}
    .hero-orbit{position:absolute;right:15%;top:50%;transform:translateY(-50%);width:180px;height:180px;border-radius:50%;border:1px solid #c7baff48;display:grid;place-items:center;box-shadow:0 0 0 23px #b6a8ff09,0 0 65px #9c88ff22}
    .hero-orbit-inner{width:119px;height:119px;border-radius:50%;background:linear-gradient(145deg,#8c79eb33,#ffffff09);border:1px solid #ffffff29;display:grid;place-items:center;backdrop-filter:blur(8px);color:#c4bbff}
    .home-section{margin-top:38px}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
    .step-card{padding:19px;position:relative}
    .step-num{color:#9082eb;font:500 11px var(--mono);margin-bottom:19px}
    .step-card p{color:var(--muted-fg);font-size:11px;line-height:1.6;margin:0}
    .step-icon{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--primary);margin-bottom:15px}
    .upload-box{border:1px dashed color-mix(in srgb,var(--primary) 45%,transparent);border-radius:14px;background:linear-gradient(130deg,color-mix(in srgb,var(--accent) 56%,transparent),var(--card));padding:26px 20px;text-align:center;transition:all .2s}
    .upload-box.dragging{border-color:var(--primary);background:var(--accent);transform:scale(1.01)}
    .upload-icon{width:45px;height:45px;margin:0 auto 12px;border-radius:14px;background:var(--accent);color:var(--primary);display:grid;place-items:center}
    .file-chip{margin-top:14px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left;background:var(--card)}
    .file-chip span{flex:1;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .danger-note{border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);background:color-mix(in srgb,var(--danger) 7%,transparent);color:var(--danger);border-radius:10px;padding:11px 13px;font-size:11px;line-height:1.5}
    .demo-note{border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:11px;padding:12px 13px;color:var(--muted-fg);font-size:11px;line-height:1.55}
    .loading-panel{padding:36px;text-align:center}
    .loading-orbit{width:55px;height:55px;border-radius:50%;border:3px solid color-mix(in srgb,var(--primary) 16%,transparent);border-top-color:var(--primary);animation:spin .9s linear infinite;margin:0 auto 18px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    .animate-in{animation:rise .35s ease both}
    .toast-stack{position:fixed;right:22px;bottom:22px;z-index:80;display:grid;gap:8px}
    .toast{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);box-shadow:0 12px 38px #10173322;padding:12px 15px;border-radius:12px;font-size:12px;animation:rise .25s ease;max-width:360px}
    .toast svg{flex:none}.toast-success svg{color:#208c75}.toast-error svg{color:var(--danger)}
    .empty-state{text-align:center;padding:37px 18px;color:var(--muted-fg)}
    .empty-icon{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px}
    .empty-state h3{color:var(--fg)}
    .empty-state p{font-size:12px;line-height:1.6;max-width:350px;margin:0 auto 16px}
    .table{width:100%;border-collapse:collapse}
    .table th{font:500 10px var(--mono);letter-spacing:.7px;text-transform:uppercase;color:var(--muted-fg);text-align:left;padding:11px 10px;border-bottom:1px solid var(--border)}
    .table td{font-size:11px;padding:13px 10px;border-bottom:1px solid var(--border)}
    .table tr:last-child td{border-bottom:0}
    .table-wrap{overflow:auto}
    .filter-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
    .search-wrap{position:relative;min-width:210px;flex:1}
    .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none}
    .search-wrap .input{padding-left:36px}
    .tag-list{display:flex;gap:7px;flex-wrap:wrap}
    .tag{padding:6px 9px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:600}
    .tag.missing{background:color-mix(in srgb,var(--danger) 8%,transparent);color:var(--danger)}
    .list-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
    .list-row:last-child{border-bottom:0;padding-bottom:0}
    .company-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#e9e5ff,#d8d4f7);color:#594aaf;display:grid;place-items:center;font:700 12px var(--serif);flex:none}
    .row-main{flex:1;min-width:0}
    .row-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-sub{color:var(--muted-fg);font-size:10px;margin-top:4px}
    .score-pill{min-width:47px;text-align:center;border-radius:9px;background:var(--accent);color:var(--accent-fg);padding:7px;font:500 11px var(--mono)}
    .score-circle{width:148px;height:148px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(#8574ed var(--score),var(--muted) 0);margin:14px auto}
    .score-circle:before{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}
    .score-circle>div{position:relative;text-align:center}
    .score-circle strong{font:700 35px var(--serif);letter-spacing:-1px}
    .score-circle span{display:block;color:var(--muted-fg);font-size:10px;margin-top:1px}
    .score-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
    .score-row:last-child{border:0}
    .score-row-icon{color:var(--primary);flex:none}
    .score-row-content{flex:1;min-width:0}
    .score-row-content strong{font-size:12px}
    .score-row-content p{margin:3px 0 0;font-size:10px;color:var(--muted-fg);line-height:1.5}
    .progress-track{height:7px;background:var(--muted);border-radius:10px;overflow:hidden}
    .progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#7361df,#a093f5);transition:width .4s}
    .chart-bars{height:180px;display:flex;align-items:end;gap:12px;border-bottom:1px solid var(--border);padding:12px 10px 0}
    .chart-col{flex:1;display:flex;align-items:center;flex-direction:column;justify-content:end;height:100%;gap:8px;min-width:0}
    .chart-bar{width:min(34px,70%);border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#a095f4,#7461df);min-height:4px;transition:height .4s}
    .chart-label{font:9px var(--mono);color:var(--muted-fg);padding-bottom:7px;white-space:nowrap}
    .score-row-link{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}
    .score-row-link:last-child{border:0}
    .footer-note{font-size:10px;color:var(--muted-fg);line-height:1.6;margin-top:25px}
    .divider{border:0;border-top:1px solid var(--border);margin:18px 0}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .settings-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--border)}
    .settings-row:last-child{border:0}
    .page-actions{display:flex;gap:8px;flex-wrap:wrap}
    .result-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
    .job-grid{align-items:stretch}
    .job-card{display:flex;flex-direction:column}
    .job-card .job-description{flex:1}
    .job-filter{width:auto;min-width:145px}
    .inline-link{color:var(--primary);font-weight:700}
    .inline-link:hover{text-decoration:underline}
    .toast-stack:empty{display:none}
    @media(max-width:1100px){.hero-orbit{right:7%;width:150px;height:150px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:767px){
      .sidebar{width:100%;height:62px;inset:auto 0 0;flex-direction:row;padding:5px 8px;justify-content:space-around;border-right:0;border-top:1px solid var(--sidebar-border);overflow:auto}
      .brand,.nav-label,.side-bottom{display:none}
      .sidebar nav{display:flex;align-items:center;gap:2px;min-width:max-content}
      .nav-link{flex-direction:column;gap:3px;padding:5px 9px;font-size:9px;margin:0}
      .nav-link svg{width:17px;height:17px}
      .nav-link.active{box-shadow:inset 0 2px #9c8dff}
      .workspace{margin-left:0;width:100%;padding-bottom:65px}
      .topbar{height:56px;padding:0 17px}
      .main-content{padding:25px 17px 45px}
      .hero{min-height:350px;padding:29px 23px}
      .hero h1{font-size:38px}
      .hero-orbit{opacity:.35;right:-48px;top:78%;width:140px;height:140px}
      .grid-2,.grid-3{grid-template-columns:1fr}
      .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .page-heading{align-items:flex-start;flex-direction:column}
      .page-heading>.btn,.page-heading>.page-actions{width:100%}
      .page-actions .btn{flex:1}
      .stat-value{font-size:27px}
      .card{padding:17px;border-radius:14px}
      .mobile-head{display:block}
      .table{min-width:650px}
      .form-grid{grid-template-columns:1fr}
      .job-filter{width:100%}
      .result-heading{display:block}
      .result-heading .btn{width:100%;margin-top:13px}
    }
    @media(max-width:390px){.nav-link{padding:5px 7px}.hero h1{font-size:34px}.main-content{padding-left:13px;padding-right:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/" aria-label="AI Resume Analyzer home"><span class="brand-mark" data-icon="sparkles"></span><span>AI Resume Analyzer<small>CAREER STUDIO</small></span></a>
      <div class="nav-label">Workspace</div>
      <nav aria-label="Workspace">
        <a class="nav-link" href="#/" data-nav="/"><span data-icon="home"></span>Home</a>
        <a class="nav-link" href="#/analyzer" data-nav="/analyzer"><span data-icon="sparkles"></span>Analyzer</a>
        <a class="nav-link" href="#/jobs" data-nav="/jobs"><span data-icon="briefcase"></span>Jobs</a>
        <a class="nav-link" href="#/dashboard" data-nav="/dashboard"><span data-icon="chart"></span>Insights</a>
        <a class="nav-link" href="#/history" data-nav="/history"><span data-icon="history"></span>History</a>
      </nav>
      <div class="nav-label" style="margin-top:18px">Preferences</div>
      <nav aria-label="Preferences">
        <a class="nav-link" href="#/about" data-nav="/about"><span data-icon="help"></span>About</a>
        <a class="nav-link" href="#/settings" data-nav="/settings"><span data-icon="settings"></span>Settings</a>
      </nav>
      <div class="side-bottom">
        <div class="prototype-note"><strong><span data-icon="shield" style="display:inline-flex;vertical-align:middle;margin-right:4px"></span>Private by design</strong>This single-file demo runs in your browser. Scores use transparent keyword rules, not an AI service.</div>

          <section class="card"><div class="filter-row" style="margin-bottom:15px"><div class="search-wrap">${icon("search",15)}<input class="input" id="history-search" type="search" value="${escapeHtml(state.historyQuery)}" placeholder="Find a role or resume" aria-label="Search analysis history"></div><span class="badge" id="history-count">${visible.length} ${visible.length===1?"analysis":"analyses"}</span></div>
          <div id="history-results">${visible.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Role</th><th>Resume file</th><th>Created</th><th>Demo signal</th><th>Skills found</th><th>Open</th></tr></thead><tbody>${visible.map(a=>`<tr><td><strong>${escapeHtml(a.jobTitle)}</strong></td><td>${escapeHtml(a.resumeName)}</td><td>${shortDate(a.createdAt)}</td><td><span class="badge ${scoreTone(a.matchScore)}">${a.matchScore}%</span></td><td>${a.matchedSkills.length} / ${a.requiredSkills?.length||a.matchedSkills.length+a.missingSkills.length}</td><td><a class="btn btn-ghost" href="#/results/${encodeURIComponent(a.id)}">View report ${icon("arrow",13)}</a></td></tr>`).join("")}</tbody></table></div>`:emptyState("history",state.analyses.length?"No matching comparisons":"Your archive is ready when you are",state.analyses.length?"Try another search term.":"Run a demo comparison and its report will be saved in this browser.",state.analyses.length?'<button class="btn btn-secondary" type="button" data-action="clear-history-search">Clear search</button>':'<a class="btn btn-primary" href="#/analyzer">Analyze a resume</a>')}</div></section>
          ${footer("Clearing history removes saved analysis results from this browser. It does not affect your profile or saved sample roles.")}`;
      }
      function renderAbout() {
        return `${heading("About AI Resume Analyzer","Useful clarity, without the black box.","A private-first career toolkit demo that makes resume-to-role comparisons more transparent.",'<span class="badge purple">'+icon("shield",12)+'LOCAL-ONLY DEMO</span>')}
          <section class="hero" style="min-height:220px;margin-bottom:19px"><div class="hero-copy"><div class="eyebrow">The purpose</div><h1 style="font-size:32px;max-width:680px">Turn a vague job search into practical next steps.</h1><p style="margin-bottom:0">Compare resume text to a role, review common skill keywords, and decide what to improve yourself.</p></div></section>
          <div class="grid grid-2"><section class="card"><div class="eyebrow">The workflow</div><h2>One clear step at a time</h2>${[["01","Add a resume","Choose a PDF and paste its text. This file does not parse PDF contents."],["02","Choose a direction","Paste a job description or use the included sample."],["03","Review the demo signals","See keyword overlap, simple text heuristics, and editing prompts."],["04","Explore sample roles","Search and save illustrative roles locally."]].map(x=>`<div class="score-row"><span class="score-row-icon mono">${x[0]}</span><div class="score-row-content"><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join("")}</section>
          <section class="card"><div class="eyebrow">Important limitations</div><h2>What this demo does and doesn't do</h2><div class="score-row"><span class="score-row-icon">${icon("check",16)}</span><div class="score-row-content"><strong>Runs in your browser</strong><p>No server, account, API key, or network service is used by this file.</p></div></div><div class="score-row"><span class="score-row-icon">${icon("info",16)}</span><div class="score-row-content"><strong>Not a genuine AI analysis</strong><p>Numbers are simple keyword and text heuristics. They do not predict hiring or certify ATS compatibility.</p></div></div><div class="score-row"><span class="score-row-icon">${icon("file",16)}</span><div class="score-row-content"><strong>PDF text extraction isn't bundled</strong><p>Paste selectable text yourself. Scanned PDFs require OCR, which is not included.</p></div></div><div class="score-row"><span class="score-row-icon">${icon("briefcase",16)}</span><div class="score-row-content"><strong>Roles are examples</strong><p>Listings are illustrative and are not live openings.</p></div></div></section></div>${footer("Standalone single-file edition · No external fonts, scripts, or stylesheets are loaded.")}`;
      }
      function renderSettings() {
        const p=state.profile;
        return `${heading("Preferences","Make this space yours.","Profile and appearance preferences are stored locally in this browser.")}
          <form id="settings-form" class="grid grid-2"><section class="card"><div class="eyebrow">Local profile</div><h2>Your direction</h2><div class="form-grid"><div class="field"><label for="profile-name">Name</label><input id="profile-name" class="input" maxlength="80" value="${escapeHtml(p.name)}" autocomplete="name"></div><div class="field"><label for="profile-email">Email (optional)</label><input id="profile-email" class="input" type="email" maxlength="120" value="${escapeHtml(p.email)}" autocomplete="email"></div><div class="field"><label for="preferred-role">Preferred role</label><input id="preferred-role" class="input" maxlength="100" value="${escapeHtml(p.preferredRole)}" placeholder="e.g. Product Analyst"></div><div class="field"><label for="preferred-location">Preferred location</label><input id="preferred-location" class="input" maxlength="100" value="${escapeHtml(p.preferredLocation)}" placeholder="e.g. Remote"></div></div><button class="btn btn-primary" style="margin-top:17px" type="submit">${icon("check",14)}Save profile locally</button></section>
          <section class="card"><div class="eyebrow">Appearance & privacy</div><h2>Browser preferences</h2><div class="settings-row"><div><strong style="font-size:12px">Color theme</strong><div class="field-hint">Switch between dark and light appearance.</div></div><button class="btn btn-secondary" type="button" data-action="toggle-theme">${icon(document.documentElement.classList.contains("dark")?"sun":"moon",15)}${document.documentElement.classList.contains("dark")?"Dark":"Light"} appearance</button></div><div class="settings-row"><div><strong style="font-size:12px">Stored analysis reports</strong><div class="field-hint">${state.analyses.length} report${state.analyses.length===1?"":"s"} in this browser</div></div><a class="btn btn-ghost" href="#/history">View history ${icon("arrow",13)}</a></div><div class="demo-note" style="margin-top:16px">${icon("shield",15)} Profile, saved roles, and reports use this browser's local storage. Resume text and the selected PDF are not retained after leaving the page. Clearing browser data removes local records.</div></section></form>
          ${footer("No profile information is sent to a server.")}`;
      }
      function refreshJobs() {
        renderJobResults();
      }
      function resetAnalyzer() {
        state.file=null;state.resumeText="";state.jobDescription="";state.jobTitle="";
        notify("Analyzer inputs cleared.","info");render();
      }
      function acceptFile(file) {
        if(!file)return;
        if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){notify("Choose a PDF file.","error");return;}
        if(!file.size){notify("This PDF is empty. Choose another file.","error");return;}
        if(file.size>12*1024*1024){notify("The PDF must be smaller than 12 MB.","error");return;}
        state.file=file;render();notify("PDF selected. Paste its text below to run the local demo.","success");
      }
      function updateHistoryResults() {
        const holder=document.getElementById("history-results");if(!holder)return;
        const visible=state.analyses.filter(a=>`${a.jobTitle} ${a.resumeName}`.toLowerCase().includes(state.historyQuery.toLowerCase()));
        const count=document.getElementById("history-count");if(count)count.textContent=`${visible.length} ${visible.length===1?"analysis":"analyses"}`;
        holder.innerHTML=visible.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Role</th><th>Resume file</th><th>Created</th><th>Demo signal</th><th>Skills found</th><th>Open</th></tr></thead><tbody>${visible.map(a=>`<tr><td><strong>${escapeHtml(a.jobTitle)}</strong></td><td>${escapeHtml(a.resumeName)}</td><td>${shortDate(a.createdAt)}</td><td><span class="badge ${scoreTone(a.matchScore)}">${a.matchScore}%</span></td><td>${a.matchedSkills.length} / ${a.requiredSkills?.length||a.matchedSkills.length+a.missingSkills.length}</td><td><a class="btn btn-ghost" href="#/results/${encodeURIComponent(a.id)}">View report ${icon("arrow",13)}</a></td></tr>`).join("")}</tbody></table></div>`:emptyState("history",state.analyses.length?"No matching comparisons":"Your archive is ready when you are",state.analyses.length?"Try another search term.":"Run a demo comparison and its report will be saved in this browser.",state.analyses.length?'<button class="btn btn-secondary" type="button" data-action="clear-history-search">Clear search</button>':'<a class="btn btn-primary" href="#/analyzer">Analyze a resume</a>');
      }
      document.addEventListener("click",event=>{
        const target=event.target.closest("[data-action]");if(!target)return;
        const action=target.dataset.action;
        if(action==="toggle-theme"){
          const light=document.documentElement.classList.toggle("dark")===false;
          writeStore(STORE.theme,light?"light":"dark");render();notify(`Switched to ${light?"light":"dark"} appearance.`,"success");
        }else if(action==="choose-file"){document.getElementById("resume-file")?.click();}
        else if(action==="remove-file"){state.file=null;render();notify("Selected PDF removed.","info");}
        else if(action==="sample-jd"){state.jobDescription=exampleJD;if(!state.jobTitle)state.jobTitle="Full Stack Developer · OrbitWorks";render();notify("Sample role description added.","success");}
        else if(action==="clear-description"){state.jobDescription="";const jd=document.getElementById("job-description");if(jd)jd.value="";const count=document.getElementById("description-count");if(count)count.textContent="0 characters";}
        else if(action==="clear-analyzer"){resetAnalyzer();}
        else if(action==="analyze"){runAnalysis();}
        else if(action==="favorite"){
          const id=target.dataset.id;
          state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];
          saveList(STORE.favorites,state.favorites);render();
          notify(state.favorites.includes(id)?"Role saved in this browser.":"Role removed from saved list.","success");
        }else if(action==="saved-filter"){state.filters.saved=!state.filters.saved;render();refreshJobs();}
        else if(action==="reset-filters"){state.filters={query:"",location:"all",role:"all",experience:"all",minimum:"all",saved:false};render();refreshJobs();}
        else if(action==="mark-applied"){
          const id=target.dataset.id;
          state.applied=state.applied.includes(id)?state.applied.filter(x=>x!==id):[...state.applied,id];
          saveList(STORE.applied,state.applied);render();
          notify(state.applied.includes(id)?"Marked as applied on this device. No application was submitted.":"Removed from your applied notes.","success");
        }else if(action==="analyze-job"){
          const job=jobs.find(item=>item.id===target.dataset.id);
          if(job){state.jobTitle=`${job.title} · ${job.company}`;state.jobDescription=`${job.description}\n\nResponsibilities:\n${job.responsibilities.join("\n")}\n\nRequired skills: ${job.requiredSkills.join(", ")}.\nPreferred skills: ${job.preferredSkills.join(", ")}.`;location.hash="#/analyzer";}
        }else if(action==="clear-history"){
          if(state.analyses.length&&window.confirm("Remove all saved demo analysis history from this browser?")){
            state.analyses=[];saveList(STORE.analyses,state.analyses);render();notify("Analysis history cleared.","success");
          }
        }else if(action==="clear-history-search"){state.historyQuery="";render();}
      });
      document.addEventListener("input",event=>{
        const target=event.target;
        if(target.id==="resume-text")state.resumeText=target.value;
        if(target.id==="job-title")state.jobTitle=target.value;
        if(target.id==="job-description"){
          state.jobDescription=target.value;
          const count=document.getElementById("description-count");if(count)count.textContent=`${target.value.length} characters`;
          const error=document.getElementById("analysis-error");if(error)error.hidden=true;
        }
        if(target.id==="job-search"){state.filters.query=target.value;refreshJobs();}
        if(target.id==="history-search"){state.historyQuery=target.value;updateHistoryResults();}
      });
      document.addEventListener("change",event=>{
        const target=event.target;
        if(target.id==="resume-file"){acceptFile(target.files?.[0]);target.value="";}
        if(target.matches("[data-filter]")){state.filters[target.dataset.filter]=target.value;refreshJobs();}
      });
      document.addEventListener("dragover",event=>{if(event.target.closest("#upload-box")){event.preventDefault();document.getElementById("upload-box")?.classList.add("dragging");}});
      document.addEventListener("dragleave",event=>{const box=document.getElementById("upload-box");if(box&&event.target===box)box.classList.remove("dragging");});
      document.addEventListener("drop",event=>{if(event.target.closest("#upload-box")){event.preventDefault();document.getElementById("upload-box")?.classList.remove("dragging");acceptFile(event.dataTransfer?.files?.[0]);}});
      document.addEventListener("keydown",event=>{
        if(event.target.id==="upload-box"&&(event.key==="Enter"||event.key===" ")){event.preventDefault();document.getElementById("resume-file")?.click();}
      });
      document.addEventListener("submit",event=>{
        if(event.target.id==="settings-form"){
          event.preventDefault();
          state.profile={
            name:document.getElementById("profile-name").value.trim()||"Your profile",
            email:document.getElementById("profile-email").value.trim(),
            preferredRole:document.getElementById("preferred-role").value.trim(),
            preferredLocation:document.getElementById("preferred-location").value.trim()
          };
          saveList(STORE.profile,state.profile);updateProfileShell();notify("Profile saved locally.","success");
        }
      });
      window.addEventListener("hashchange",render);
      render();
      if(routeInfo().page==="jobs")refreshJobs();
    })();
  </script>
</body>
</html>
